<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Budget</title>
    <script>
      // Apply a saved Light or Dark theme and the pink palette before the
      // first paint, so there's no flash of the wrong look. The one place
      // storage is read outside src/shared/storage/; the keys and values
      // match theme.ts and palette.ts there.
      try {
        var theme = localStorage.getItem('budget-app:theme')
        if (theme === 'light' || theme === 'dark') {
          document.documentElement.dataset.theme = theme
        }
        var palette = localStorage.getItem('budget-app:palette')
        if (palette === 'pink') {
          document.documentElement.dataset.palette = palette
        }
      } catch (error) {
        // Storage is blocked: leave System and the sunset palette.
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
